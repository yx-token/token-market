# token-market 配置示例。三个服务（api、worker、edge）共用。
# 敏感项建议用环境变量覆盖：TM_DATABASE_DSN、TM_REDIS_PASSWORD、TM_SUB2API_ADMIN_API_KEY、TM_SUB2API_REPLICA_DSN、
# TM_CRYPTO_KEYS（"k1:base64,k2:base64"）、TM_CRYPTO_ACTIVE_KEY_ID、TM_CRYPTO_HASH_PEPPER、TM_AUTH_JWT_SECRET、
# TM_BOOTSTRAP_ADMIN_EMAIL、TM_BOOTSTRAP_ADMIN_PASSWORD。完整列表见 internal/platform/config/config.go。
env: dev                                # prod 时强制要求 crypto.hash_pepper

http:
  addr: ":8080"                         # market-api
  trusted_proxies: []                   # 前置负载均衡的 IP / CIDR；只有来自它们的请求才采信 X-Forwarded-For
  web_dir: ""                           # 前端构建产物目录（web/dist），设置后 market-api 同时提供前端页面

database:
  dsn: "postgres://tm:tm@127.0.0.1:5432/token_market?sslmode=disable"
  max_conns: 20
  time_zone: "Asia/Shanghai"            # 会话时区：按天统计（账单、用量、今日收益、每日检测预算）的日界

redis:
  addr: "127.0.0.1:6379"
  db: 0

crypto:
  active_key_id: "k1"
  keys:
    # 32 字节随机密钥的 base64：openssl rand -base64 32。轮换时新增密钥并切换 active_key_id，旧密钥保留用于解密
    k1: "REPLACE_WITH_BASE64_32_BYTES"
  # 盲索引（证件号、官方账号去重）的密钥，一经使用不能更换
  hash_pepper: "REPLACE_WITH_RANDOM_STRING"

auth:
  jwt_secret: "REPLACE_WITH_AT_LEAST_32_BYTES_RANDOM"
  token_ttl: 24h
  # 首次启动时若没有任何管理员，用这组账号创建（之后可删除这两项）
  bootstrap_admin_email: ""
  bootstrap_admin_password: ""

sub2api:
  base_url: "http://127.0.0.1:8081"     # sub2api 内网地址（Admin API、用户 API）
  gateway_url: ""                       # 网关地址，默认与 base_url 相同（Edge 与质量检测使用）
  admin_api_key: ""                     # sub2api 后台生成的 Admin API Key（管理员需先完成合规确认）
  replica_dsn: "postgres://readonly:pass@127.0.0.1:5432/sub2api?sslmode=disable"
  shadow_email_domain: "shadow.token-market.internal"   # 影子用户邮箱域名
  timeout: 30s

worker:
  admin_addr: ":8092"                   # /healthz、/debug/vars，只在内网开放
  ops_batch_size: 20
  ops_poll_interval: 1s
  compat_guard_interval: 5m
  scheduler_interval: 30s
  ingest_interval: 15s
  quality_interval: 30s
  probe_concurrency: 4
  reconcile_interval: 10m               # Edge 尝试日志与 usage_logs 逐条对账
  balance_reconcile_interval: 30m       # 买家余额恒等式核对

edge:
  public_url: "https://api.example.com" # 买家调用模型使用的地址，在买家控制台展示
  addr: ":8090"                         # 买家 API 入口
  admin_addr: ":8091"                   # /healthz、/debug/vars
  connect_timeout: 3s
  first_byte_timeout: 30s               # 整个请求（含故障转移）的首字节截止时间
  max_body_bytes: 33554432
  breaker_failures: 5
  breaker_cooldown: 30s
  spool_dir: "data/edge-spool"          # 尝试日志写库失败时的本地暂存目录
  trusted_proxies: []                   # 前置负载均衡的 IP / CIDR（IP 白名单依赖它）
  invalid_key_limit: 30                 # 单个 IP 每分钟允许的无效 Key 次数，-1 表示不限制
update:
  repository: yx-token/token-market
  runtime_dir: data/runtime
  # 私有仓库令牌建议通过 TM_UPDATE_GITHUB_TOKEN 注入。
  github_token: ""
