# token-market 部署示例。闲猫宿主（sub2api）单独部署（不在本文件中，单机部署见 single-host/），本系统通过内网访问它的 Admin API、网关与只读库。
#
# 使用（镜像由发布流程推送到 GHCR，见 README"发布与部署"）：
#   cp deploy/.env.example deploy/.env   # 填写镜像版本、密钥与 sub2api 连接信息
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
# 不用发布的镜像、自己构建时：在仓库根目录 docker build -f market/Dockerfile -t token-market:local . 后把 TM_IMAGE 设为 token-market:local。
#
# 对外只需暴露 api（控制面与前端）和 edge（买家调用模型）；worker 与各管理端口只在内网。
name: token-market

x-market-env: &market-env
  TM_ENV: prod
  TM_DATABASE_DSN: postgres://market:${MARKET_DB_PASSWORD}@postgres:5432/token_market?sslmode=disable
  TM_REDIS_ADDR: redis:6379
  TM_SUB2API_BASE_URL: ${SUB2API_BASE_URL}
  TM_SUB2API_GATEWAY_URL: ${SUB2API_GATEWAY_URL:-}
  TM_SUB2API_ADMIN_API_KEY: ${SUB2API_ADMIN_API_KEY}
  TM_SUB2API_REPLICA_DSN: ${SUB2API_REPLICA_DSN}
  TM_CRYPTO_ACTIVE_KEY_ID: ${CRYPTO_ACTIVE_KEY_ID:-k1}
  TM_CRYPTO_KEYS: ${CRYPTO_KEYS}
  TM_CRYPTO_HASH_PEPPER: ${CRYPTO_HASH_PEPPER}
  TM_AUTH_JWT_SECRET: ${JWT_SECRET}
  TM_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  TM_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  TM_EDGE_PUBLIC_URL: ${EDGE_PUBLIC_URL}
  TM_HTTP_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  TM_EDGE_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  TM_UPDATE_RUNTIME_DIR: /app/runtime

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${MARKET_DB_PASSWORD}
      POSTGRES_DB: token_market
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d token_market"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  api:
    image: ${TM_IMAGE:-ghcr.io/yx-token/token-market:latest}
    entrypoint: ["/app/bin/market-runner"]
    command: ["api"]
    stop_grace_period: 45s
    environment:
      <<: *market-env
      TM_HTTP_ADDR: ":8080"
      TM_UPDATE_REPOSITORY: ${UPDATE_REPOSITORY:-yx-token/token-market}
      TM_UPDATE_GITHUB_TOKEN: ${UPDATE_GITHUB_TOKEN:-}
    volumes: [runtime:/app/runtime]
    ports: ["${API_PORT:-8080}:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    image: ${TM_IMAGE:-ghcr.io/yx-token/token-market:latest}
    entrypoint: ["/app/bin/market-runner"]
    command: ["worker"]
    stop_grace_period: 45s
    environment:
      <<: *market-env
      TM_WORKER_ADMIN_ADDR: ":8092"
    volumes: [runtime:/app/runtime]
    depends_on: [api]
    restart: unless-stopped

  edge:
    image: ${TM_IMAGE:-ghcr.io/yx-token/token-market:latest}
    entrypoint: ["/app/bin/market-runner"]
    command: ["edge"]
    stop_grace_period: 45s
    environment:
      <<: *market-env
      TM_EDGE_ADDR: ":8090"
    ports: ["${EDGE_PORT:-8090}:8090"]
    volumes: [edgespool:/app/data, runtime:/app/runtime]
    # 不依赖 api：单进程 MARKET_EMBED 时无独立 api；edge 只需要库与 redis
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  edgespool:
  runtime:
