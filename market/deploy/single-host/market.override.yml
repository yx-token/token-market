# token-market 在本机的部署覆盖（单进程模式 P5c）：
# - 市场库 / redis 入共享网络，供宿主 MARKET_EMBED 直连
# - 停掉独立 api / worker（已由宿主进程承接）；只保留 edge（买家模型流量）
services:
  postgres:
    networks:
      default: {}
      shared:
        aliases: [market-postgres]
  redis:
    networks:
      default: {}
      shared:
        aliases: [market-redis]
  api:
    profiles: ["legacy-split"]
    networks: [default, shared]
  worker:
    profiles: ["legacy-split"]
    networks: [default, shared]
  edge:
    networks: [default, shared]

networks:
  shared:
    name: token-market
    external: true
