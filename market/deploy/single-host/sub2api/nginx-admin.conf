# 闲猫宿主备用管理入口（仅绑定 127.0.0.1）。nginx 直接面对隧道客户端，
# 客户端地址以连接地址为准，不采信请求自带的 X-Forwarded-For。
#
# 站内更新已指向本仓 Release（UPDATE_GITHUB_REPO=yx-token/token-market），
# 升级宿主二进制（含嵌入管理端）与包内 market-web；edge 仍需随 TM_IMAGE 升级。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 64m;

    location / {
        proxy_pass http://sub2api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
