# sub2api 对外入口（管理后台与网关）。nginx 直接面对公网，客户端地址以连接地址为准，不采信请求自带的 X-Forwarded-For。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    client_max_body_size 64m;

    # 禁止在线升级 / 回滚：sub2api 升级必须先过 token-market 的 s2a-compat 兼容检查
    location ~ ^/api/v1/admin/system/(update|rollback) {
        return 403 "online update is disabled; upgrade via token-market s2a-compat\n";
    }

    location / {
        proxy_pass http://sub2api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
