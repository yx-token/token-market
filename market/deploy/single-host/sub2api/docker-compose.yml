# 闲猫宿主（引擎：网关 + 管理 API，镜像 ghcr.io/yx-token/sub2api，同仓与 token-market 一起发布）。
#   - 镜像版本固定在 .env 的 ENGINE_IMAGE，与 market.env 的 TM_IMAGE 使用同一个发布版本，两边一起升级
#   - 闲猫运营接口（/api/v1/admin/market/*）直连市场库：经共享网络 token-market 访问 market-postgres
#   - 备用入口 sub2api-admin（nginx）只绑定 127.0.0.1:${SUB2API_PUBLIC_PORT:-8081}，不对公网开放，
#     经 SSH 隧道访问（ssh -L 8081:127.0.0.1:8081 root@<服务器>）；日常管理走 token-market 的 /admin，
#     并禁用在线升级 / 回滚接口（宿主自带的在线升级会换成上游社区版本）
#   - 服务改名 sub2api-postgres / sub2api-redis，避免在共享网络上与 token-market 自己的 postgres / redis 重名
name: sub2api

services:
  sub2api:
    image: ${ENGINE_IMAGE:?ENGINE_IMAGE is required}
    container_name: sub2api
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: { soft: 100000, hard: 100000 }
    volumes:
      - sub2api_data:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: sub2api-postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: sub2api-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      TZ: Asia/Shanghai
      # 只信任前置 nginx 传来的客户端地址（登录限流、审计按真实 IP）
      SERVER_TRUSTED_PROXIES: 172.31.250.0/24
      # token-market 基线配置（token-market docs/02 第 6 节）
      GATEWAY_SCHEDULING_PREFER_SOONEST_RESET: "true"
      GATEWAY_USAGE_RECORD_OVERFLOW_POLICY: sync
      # 闲猫运营接口直连市场库（读写）与本机引擎库（供给融合）；市场库晚于引擎启动时按需重连
      MARKET_DATABASE_DSN: postgres://market:${MARKET_DB_PASSWORD:?MARKET_DB_PASSWORD is required}@market-postgres:5432/token_market?sslmode=disable
      MARKET_ENGINE_DSN: postgres://sub2api:${POSTGRES_PASSWORD}@sub2api-postgres:5432/sub2api?sslmode=disable
      # 宿主进程内经 enginehost 构建市场应用（/api/v1/admin/market/* 的 relay 路由，如 inspection/checks、
      # org/*、ledger 等），需要与市场 api 一致的运行配置；下列密钥须与 market.env 保持一致
      TM_ENV: prod
      TM_DATABASE_DSN: postgres://market:${MARKET_DB_PASSWORD:?MARKET_DB_PASSWORD is required}@market-postgres:5432/token_market?sslmode=disable
      TM_SUB2API_REPLICA_DSN: postgres://tm_readonly:${READONLY_PASSWORD:?READONLY_PASSWORD is required}@sub2api-postgres:5432/sub2api?sslmode=disable
      TM_REDIS_ADDR: market-redis:6379
      TM_SUB2API_BASE_URL: http://sub2api:8080
      TM_SUB2API_ADMIN_API_KEY: ${SUB2API_ADMIN_API_KEY:?SUB2API_ADMIN_API_KEY is required}
      TM_CRYPTO_ACTIVE_KEY_ID: ${CRYPTO_ACTIVE_KEY_ID:-k1}
      TM_CRYPTO_KEYS: ${CRYPTO_KEYS:?CRYPTO_KEYS is required}
      TM_CRYPTO_HASH_PEPPER: ${CRYPTO_HASH_PEPPER:?CRYPTO_HASH_PEPPER is required}
      TM_AUTH_JWT_SECRET: ${MARKET_JWT_SECRET:?MARKET_JWT_SECRET is required}
    depends_on:
      sub2api-postgres: { condition: service_healthy }
      sub2api-redis: { condition: service_healthy }
    networks: [internal, shared]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  sub2api-postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: sub2api
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal, shared]   # token-market 用只读账号 tm_readonly 访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api && psql -U sub2api -d sub2api -Atqc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  sub2api-redis:
    image: redis:8-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 备用管理入口：只绑定本机回环，公网不开放；用 SSH 隧道访问 http://127.0.0.1:8081
  sub2api-admin:
    image: nginx:1.29-alpine
    container_name: sub2api-admin
    restart: unless-stopped
    ports: ["127.0.0.1:${SUB2API_PUBLIC_PORT:-8081}:80"]
    volumes:
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [sub2api]
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.31.250.0/24   # 固定网段，SERVER_TRUSTED_PROXIES 依赖它
  shared:
    name: token-market

volumes:
  sub2api_data:
  postgres_data:
  redis_data:
