<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>闲猫 · 订阅额度集市</title>
    <meta name="theme-color" content="#ffe60f" />
    <script>
      /* 首屏前按路径挂主题，避免 /console 刷新先闪市场黄 */
      (function () {
        var p = location.pathname || '/'
        var consolePath = p === '/console' || p.indexOf('/console/') === 0 || p === '/admin' || p.indexOf('/admin/') === 0
        document.documentElement.classList.add(consolePath ? 'is-console' : 'is-market')
        if (consolePath) {
          var m = document.querySelector('meta[name="theme-color"]')
          if (m) m.setAttribute('content', '#0555ce')
        }
      })()
    </script>
    <style>
      html.is-console, html.is-console body { background: #f2f4f7 !important; }
      html.is-console body::before { display: none !important; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Instrument+Sans:wght@500;600;700&family=ZCOOL+QingKe+HuangYou&display=swap" rel="stylesheet" />
    <link rel="icon" href="/assets/xianmao-pet.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
