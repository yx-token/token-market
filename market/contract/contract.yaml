# token-market 对 sub2api 的依赖契约。
#
# s2a-compat 用它检查 sub2api 升级是否与本系统冲突；运行时自检用 verified_versions 判断
# 当前 sub2api 是否已验证兼容。修改本系统对 sub2api 的任何依赖时，同步更新本文件。
version: 1

sub2api:
  # 已验证兼容的版本。migration_fingerprints 是该版本 schema_migrations 文件名集合的哈希，
  # 可以有多个（例如生产库因历史迁移遗留与全新安装不同）。
  # 生成：s2a-compat fingerprint --sub2api-repo <path> --ref v0.2.14
  verified_versions:
    - version: "0.2.13"
      migration_fingerprints:
        - "sha256:c0a0ae745bf4cffd3eddf893b621fa6c37ee0f470138cb38df85c624ede77358"   # 当前宿主 backend/cmd/server VERSION
    - version: "0.2.14"
      migration_fingerprints:
        - "sha256:c0a0ae745bf4cffd3eddf893b621fa6c37ee0f470138cb38df85c624ede77358"   # 全新安装，291 个迁移

# 只读库用到的表与列。large 表示大表，涉及它的锁表迁移会被提示。
tables:
  usage_logs:
    large: true
    used_by: [billing, quality]
    columns: [id, request_id, created_at, user_id, api_key_id, account_id, group_id, model,
              input_tokens, output_tokens, cache_creation_tokens, cache_read_tokens,
              total_cost, actual_cost, account_rate_multiplier, first_token_ms, duration_ms,
              upstream_response_model, upstream_model_mismatch]
  accounts:
    used_by: [scheduling, quality]
    columns: [id, name, platform, type, status, error_message, schedulable, priority, concurrency,
              load_factor, rate_multiplier, rate_limit_reset_at, overload_until,
              temp_unschedulable_until, temp_unschedulable_reason, extra, deleted_at, session_window_end]
  account_groups:
    used_by: [scheduling]
    columns: [account_id, group_id]
  groups:
    used_by: [scheduling]
    columns: [id, name, platform, rate_multiplier, is_exclusive, profit_control_enabled, deleted_at]
  users:
    used_by: [billing]
    columns: [id, email, balance, status, deleted_at]
  api_keys:
    used_by: [billing, edge]
    columns: [id, user_id, key, group_id, status, deleted_at]
  schema_migrations:
    used_by: [compat]
    columns: [filename, checksum]
  audit_logs:
    used_by: [listing]   # 同步 sub2api 自动使用 Codex 重置卡的结果
    columns: [id, created_at, action, extra]

# 读写的 jsonb 键（SQL 无法表达，靠行为契约测试验证）。
jsonb_keys:
  accounts.extra:
    read: [quota_used, quota_daily_used, quota_weekly_used, session_window_utilization,
           codex_reset_credit_snapshot, codex_auto_reset_credit_state, auto_reset_credit_enabled,
           auto_reset_credit_5h_threshold, auto_reset_credit_7d_threshold,
           email_address, email, passive_usage_7d_utilization, passive_usage_7d_reset,
           passive_usage_7d_oi_utilization, passive_usage_7d_oi_reset,
           codex_5h_used_percent, codex_7d_used_percent, codex_5h_reset_at, codex_7d_reset_at]   # 官方账号邮箱，补齐 0019 之前接入的上游
    write: [window_cost_limit, base_rpm, max_sessions, quota_daily_limit, quota_weekly_limit,
            auto_reset_credit_enabled, auto_reset_credit_5h_threshold, auto_reset_credit_7d_threshold]
  audit_logs.extra:
    read: [account_id, result_code, trigger_window, windows_reset, error_code]
  accounts.credentials:
    write: [account_scheduling_threshold, account_mode, api_protocol, base_url, zhipu_organization, zhipu_project]

# 依赖的枚举值。数据库 CHECK 约束删除其中的值视为冲突，新增值视为提示。
enums:
  accounts.platform: [anthropic, openai, gemini, antigravity, grok, kimi, zhipu, minimax, opencode_go]
  accounts.type: [oauth, setup-token, apikey]
  groups.platform: [anthropic, openai, gemini, antigravity, grok, kimi, zhipu, minimax, opencode_go, composite]

# 用到的 Admin API 与用户 API（字段由行为契约测试校验）。
admin_api:
  - {method: GET,    path: /api/v1/admin/system/version}
  - {method: POST,   path: /api/v1/admin/users,                  request: [email, password, concurrency, allowed_groups]}
  - {method: PUT,    path: "/api/v1/admin/users/:id",            request: [concurrency, rpm_limit, status, allowed_groups]}
  - {method: POST,   path: "/api/v1/admin/users/:id/balance",    request: [balance, operation, notes], idempotency_key: required}
  - {method: POST,   path: /api/v1/admin/groups,                 request: [name, platform, rate_multiplier, is_exclusive, profit_control_enabled, profit_min_margin, profit_safety_buffer]}
  - {method: PUT,    path: "/api/v1/admin/groups/:id"}
  - {method: DELETE, path: "/api/v1/admin/groups/:id"}
  - {method: POST,   path: /api/v1/admin/proxies,                request: [name, protocol, host, port, username, password], idempotency_key: required}
  - {method: DELETE, path: "/api/v1/admin/proxies/:id"}
  - {method: POST,   path: "/api/v1/admin/proxies/:id/test"}
  - {method: POST,   path: "/api/v1/admin/proxies/:id/quality-check"}
  - {method: POST,   path: /api/v1/admin/accounts,               request: [name, notes, platform, type, credentials, extra, proxy_id, concurrency, priority, rate_multiplier, load_factor, group_ids], idempotency_key: required}
  - {method: PUT,    path: "/api/v1/admin/accounts/:id",           request: [credentials, extra, concurrency, priority, rate_multiplier, load_factor, status, group_ids]}
  - {method: POST,   path: "/api/v1/admin/accounts/:id/clear-error"}
  - {method: GET,    path: /api/v1/admin/channels/model-pricing}
  - {method: POST,   path: /api/v1/admin/accounts/bulk-update,   request: [account_ids, concurrency, priority, rate_multiplier, load_factor, schedulable, group_ids, credentials, extra]}
  - {method: POST,   path: "/api/v1/admin/accounts/:id/schedulable", request: [schedulable]}
  - {method: DELETE, path: "/api/v1/admin/accounts/:id"}
  - {method: POST,   path: "/api/v1/admin/accounts/:id/set-privacy"}
  - {method: GET,    path: "/api/v1/admin/cn-providers/accounts/:id/quota"}
  - {method: GET,    path: "/api/v1/admin/accounts/:id/usage"}
  - {method: GET,    path: "/api/v1/admin/accounts/:id"}
  - {method: POST,   path: "/api/v1/admin/accounts/:id/recover-state"}
  - {method: POST,   path: "/api/v1/admin/openai/accounts/:id/quota/refresh"}
  - {method: POST,   path: "/api/v1/admin/openai/accounts/:id/reset-quota"}
  - {method: GET,    path: "/api/v1/admin/accounts/:id/claude/reset-credits"}
  - {method: POST,   path: "/api/v1/admin/accounts/:id/claude/reset-credits/redeem", idempotency_key: required}
  - {method: POST,   path: /api/v1/admin/accounts/generate-auth-url,        request: [proxy_id]}
  - {method: POST,   path: /api/v1/admin/accounts/generate-setup-token-url, request: [proxy_id]}
  - {method: POST,   path: /api/v1/admin/accounts/exchange-code,            request: [session_id, code, proxy_id]}
  - {method: POST,   path: /api/v1/admin/accounts/exchange-setup-token-code, request: [session_id, code, proxy_id]}
  - {method: POST,   path: /api/v1/admin/openai/generate-auth-url,          request: [proxy_id]}
  - {method: POST,   path: /api/v1/admin/openai/exchange-code,              request: [session_id, code, state, proxy_id]}
  - {method: POST,   path: /api/v1/admin/gemini/oauth/auth-url,             request: [proxy_id, oauth_type, project_id]}
  - {method: POST,   path: /api/v1/admin/gemini/oauth/exchange-code,        request: [session_id, state, code, proxy_id, oauth_type]}
  - {method: POST,   path: /api/v1/admin/antigravity/oauth/auth-url,        request: [proxy_id]}
  - {method: POST,   path: /api/v1/admin/antigravity/oauth/exchange-code,   request: [session_id, state, code, proxy_id]}
  - {method: POST,   path: /api/v1/admin/grok/oauth/auth-url,               request: [proxy_id]}
  - {method: POST,   path: /api/v1/admin/grok/oauth/exchange-code,          request: [session_id, state, code, proxy_id]}
user_api:
  - {method: POST,   path: /api/v1/auth/login,   request: [email, password]}
  - {method: POST,   path: /api/v1/auth/refresh, request: [refresh_token]}
  - {method: POST,   path: /api/v1/keys,         request: [name, group_id, custom_key]}
  - {method: PUT,    path: "/api/v1/keys/:id"}
  - {method: DELETE, path: "/api/v1/keys/:id"}

# Edge 与质量检测经由 sub2api 网关调用的接口（买家流量与探测流量）。
gateway_api:
  - {method: POST, path: /v1/messages}
  - {method: POST, path: /v1/messages/count_tokens}
  - {method: POST, path: /v1/chat/completions}
  - {method: POST, path: /v1/responses}
  - {method: GET,  path: /v1/models}
  - {method: POST, path: "/v1beta/models/:model"}

# 依赖的 sub2api 配置项。
config:
  gateway.scheduling.prefer_soonest_reset: true
  gateway.usage_record.overflow_policy: sync

# Edge 对账依赖的响应头。
response_headers:
  X-Client-Request-ID: "每个网关请求都返回；usage_logs.request_id = 'client:' + 该值"
