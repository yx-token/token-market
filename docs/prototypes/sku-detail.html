<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>闲猫 · 供给详情</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_center-shell.css" />
  <style>
    .layout {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 840px) {
      .layout { grid-template-columns: 1fr; }
    }
    .cover {
      border-radius: 18px;
      overflow: hidden;
      background: #ddd;
      aspect-ratio: 4/3;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .kind {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 8px;
      background: rgba(0,0,0,.06);
      margin-bottom: 10px;
    }
    .kind.pack { background: rgba(255, 200, 80, .4); color: #9a3412; }
    .kind.pool { background: rgba(134, 239, 172, .4); color: #166534; }
    .specs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }
    .spec {
      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 12px;
      padding: 12px 14px;
    }
    .spec b { display: block; font-size: 12px; color: #888; font-weight: 700; margin-bottom: 4px; }
    .spec span { font-size: 15px; font-weight: 700; }
    .panel {
      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 18px;
      padding: 22px 20px;
      position: sticky;
      top: 88px;
    }
    .pay-price {
      font-size: 32px;
      font-weight: 800;
      color: #ff5000;
      margin: 8px 0 4px;
    }
    .pay-sub { font-size: 13px; color: #888; margin-bottom: 18px; line-height: 1.5; }
    .pay-ways { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .pay-way {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid rgba(0,0,0,.1);
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    .pay-way.on { border-color: #1f1f1f; background: rgba(255,230,15,.25); }
    .pay-way input { accent-color: #1f1f1f; }
    .btn-pay {
      width: 100%;
      border: none;
      border-radius: 14px;
      background: #ffe60f;
      color: #1f1f1f;
      font-size: 16px;
      font-weight: 800;
      padding: 14px;
      cursor: pointer;
    }
    .btn-pay:hover { filter: brightness(0.97); }
    .rules {
      margin-top: 16px;
      font-size: 12px;
      color: #777;
      line-height: 1.65;
    }
    .done {
      display: none;
      margin-top: 16px;
      padding: 14px;
      background: #f0fdf4;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.6;
      color: #166534;
    }
    .done.is-on { display: block; }
    .done code {
      display: block;
      margin-top: 8px;
      padding: 8px 10px;
      background: #fff;
      border-radius: 8px;
      font-size: 12px;
      color: #111;
      word-break: break-all;
    }
    .back { font-size: 14px; font-weight: 700; color: #666; }
    .back:hover { color: #1f1f1f; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-row">
      <a class="logo" href="market-home.html">
        <img src="assets/xianmao-pet.svg" alt="" width="36" height="36" />
        闲猫
      </a>
      <span class="role-tag">供给详情</span>
      <div class="spacer"></div>
      <a class="nav-link back" href="market-home.html">← 回市场</a>
    </div>
  </header>

  <main class="wrap" style="max-width:1040px">
    <div class="layout" id="root">
      <p style="color:#888">加载中…</p>
    </div>
  </main>

  <script>
    const list = [
      { id: "c-1001", kind: "channel", plat: "Claude", tier: "Max 5x", title: "Claude · Max 5x · 按量通道", img: "card1.jpg", mult: 0.55, min: 0, grade: "S", success: 0.98, ttft: 420 },
      { id: "c-1002", kind: "channel", plat: "ChatGPT", tier: "Plus", title: "ChatGPT · Plus · Codex 可用", img: "card2.jpg", mult: 0.62, min: 10, grade: "A", success: 0.96, ttft: 380 },
      { id: "c-1003", kind: "channel", plat: "Kimi", tier: "Coding", title: "Kimi · Coding Plan · 按量", img: "card3.jpg", mult: 0.48, min: 0, grade: "A", success: 0.97, ttft: 510 },
      { id: "c-1004", kind: "channel", plat: "Gemini", tier: "Ultra", title: "Gemini · Google One Ultra", img: "card4.jpg", mult: 0.70, min: 20, grade: "B", success: 0.94, ttft: 450 },
      { id: "c-1005", kind: "channel", plat: "智谱", tier: "Coding", title: "智谱 · GLM Coding · 国内站", img: "card5.jpg", mult: 0.50, min: 0, grade: "A", success: 0.95, ttft: 480 },
      { id: "c-1006", kind: "channel", plat: "Grok", tier: "Super", title: "Grok · SuperGrok · 刚过检", img: "card6.jpg", mult: 0.68, min: 5, grade: "A", success: 0.93, ttft: 390 },
      { id: "c-1007", kind: "channel", plat: "MiniMax", tier: "Coding", title: "MiniMax · Coding · 国际站", img: "card7.jpg", mult: 0.54, min: 0, grade: "B", success: 0.92, ttft: 560 },
      { id: "c-1008", kind: "channel", plat: "Claude", tier: "Pro", title: "Claude · Pro · 按量通道", img: "card8.jpg", mult: 0.58, min: 0, grade: "A", success: 0.97, ttft: 440 },
      { id: "c-1009", kind: "channel", plat: "ChatGPT", tier: "Team", title: "ChatGPT · Team · 可做备用跳", img: "card9.jpg", mult: 0.66, min: 10, grade: "B", success: 0.95, ttft: 410 },
      { id: "c-1010", kind: "channel", plat: "Claude", tier: "Max 20x", title: "Claude · Max 20x · S 级", img: "card13.jpg", mult: 0.57, min: 0, grade: "S", success: 0.99, ttft: 360 },
      { id: "c-1011", kind: "channel", plat: "保障池", tier: "Claude", title: "Claude 保障池 · 自动派号", img: "card15.jpg", mult: 0.80, min: 0, grade: "A", success: 0.99, ttft: 400, pool: true },
      { id: "c-1012", kind: "channel", plat: "保障池", tier: "ChatGPT", title: "ChatGPT 保障池 · 自动派", img: "hero2.jpg", mult: 0.70, min: 0, grade: "A", success: 0.98, ttft: 390, pool: true },
      { id: "c-1013", kind: "channel", plat: "Kimi", tier: "Coding", title: "Kimi · 高成功率卖家", img: "card10.jpg", mult: 0.51, min: 0, grade: "S", success: 0.99, ttft: 490 },
      { id: "c-1014", kind: "channel", plat: "Antigravity", tier: "OAuth", title: "Antigravity · OAuth 按量", img: "thumb7.jpg", mult: 0.61, min: 10, grade: "B", success: 0.91, ttft: 520 },
      { id: "c-1015", kind: "channel", plat: "智谱", tier: "团队版", title: "智谱 · 团队版 · 组织已配", img: "card11.jpg", mult: 0.53, min: 0, grade: "A", success: 0.94, ttft: 500 },
      { id: "p-2001", kind: "pack", plat: "Claude", tier: "Max", title: "Claude · Max · 30 天订阅", img: "card14.jpg", mult: 0.55, face: 99, price: 99, days: 30, quota: 150, stock: 3, grade: "S", success: 0.98, ttft: 420 },
      { id: "p-2002", kind: "pack", plat: "Kimi", tier: "Coding", title: "Kimi Coding · 7 天订阅", img: "thumb5.jpg", mult: 0.48, face: 49, price: 49, days: 7, quota: 80, stock: 8, grade: "A", success: 0.97, ttft: 510 },
      { id: "p-2003", kind: "pack", plat: "ChatGPT", tier: "Plus", title: "ChatGPT · Plus · 30 天订阅", img: "thumb11.jpg", mult: 0.62, face: 129, price: 129, days: 30, quota: 200, stock: 2, grade: "A", success: 0.96, ttft: 380 },
      { id: "p-2004", kind: "pack", plat: "智谱", tier: "Coding", title: "智谱 · Coding · 30 天订阅", img: "thumb10.jpg", mult: 0.52, face: 79, price: 79, days: 30, quota: 120, stock: 5, grade: "B", success: 0.93, ttft: 530 },
      { id: "p-2005", kind: "pack", plat: "MiniMax", tier: "Coding", title: "MiniMax · 7 天订阅", img: "card7.jpg", mult: 0.54, face: 39, price: 39, days: 7, quota: 60, stock: 1, grade: "A", success: 0.94, ttft: 550 },
      { id: "p-2006", kind: "pack", plat: "Gemini", tier: "Pro", title: "Gemini · Pro · 90 天订阅", img: "card12.jpg", mult: 0.69, face: 199, price: 199, days: 90, quota: 300, stock: 4, grade: "B", success: 0.92, ttft: 460 },
    ];
    const id = new URLSearchParams(location.search).get("id") || "c-1001";
    const s = list.find((x) => x.id === id) || list[0];
    const isSub = s.kind === "pack";
    s.desc = isSub
      ? `订阅套餐：付 ¥${s.price || s.face} 获得 ${s.days || 30} 天使用权，期内额度 ¥${s.quota || s.face}，按 ${s.mult.toFixed(2)}× 抵扣。到期或用尽即止；退货按卖家服务标签。`
      : (s.pool
        ? `平台保障池按量通道，倍率 ${s.mult.toFixed(2)}×。下单付起步金后签发 Key，调用只扣平台余额。`
        : `按量通道，倍率 ${s.mult.toFixed(2)}×，起步金 M=${s.min === 0 ? "0（免费开通）" : "¥" + s.min}。用完 M 后继续扣平台余额；余额不足提示充值。`);
    const payAmount = isSub ? (s.price || s.face) : s.min;
    const kindClass = s.pool ? "pool" : isSub ? "pack" : "";
    const kindText = s.pool ? "保障池 · 按量通道" : isSub ? "订阅套餐" : "按量通道";

    document.getElementById("root").innerHTML = `
      <div>
        <span class="kind ${kindClass}">${kindText}</span>
        <h1 style="margin:0 0 8px;font-size:26px">${s.title}</h1>
        <p class="lead" style="margin-bottom:16px">${s.desc}</p>
        <div class="cover"><img src="assets/${s.img}" alt="" /></div>
        <div class="specs">
          <div class="spec"><b>厂商 / 档位</b><span>${s.plat} · ${s.tier}</span></div>
          <div class="spec"><b>质量等级</b><span>${s.grade} 级</span></div>
          <div class="spec"><b>计费倍率</b><span>${s.mult.toFixed(2)}× 官方价</span></div>
          <div class="spec"><b>24h 成功率</b><span>${(s.success * 100).toFixed(0)}% · ${s.ttft}ms</span></div>
          ${isSub
            ? `<div class="spec"><b>套餐售价</b><span>¥${s.price || s.face}</span></div><div class="spec"><b>订阅周期</b><span>${s.days || 30} 天</span></div><div class="spec"><b>期内额度</b><span>¥${s.quota || s.face}</span></div><div class="spec"><b>可售份数</b><span>${s.stock} 份</span></div>`
            : `<div class="spec"><b>最低额度 M</b><span>${s.min === 0 ? "¥0（免费开通）" : "¥" + s.min}</span></div><div class="spec"><b>超额计费</b><span>只扣平台余额</span></div>`}
        </div>
      </div>
      <div class="panel">
        <div style="font-size:13px;font-weight:700;color:#888">本单应付</div>
        <div class="pay-price">${payAmount === 0 ? "¥0" : "¥" + payAmount}</div>
        <div class="pay-sub">
          ${isSub
            ? `支付套餐价后获得 Key，${s.days || 30} 天内可用期内额度 ¥${s.quota || s.face}。到期或用尽即止。`
            : (payAmount === 0
              ? "0 元开通通道，签发 Key。之后调用从平台余额扣费。"
              : "支付起步金开通通道。用完起步额度后继续扣平台余额。")}
        </div>
        <div class="pay-ways">
          <label class="pay-way on"><input type="radio" name="pay" value="balance" checked /> 平台余额</label>
          <label class="pay-way"><input type="radio" name="pay" value="alipay" /> 支付宝</label>
          <label class="pay-way"><input type="radio" name="pay" value="wechat" /> 微信支付</label>
        </div>
        <button class="btn-pay" type="button" id="btn-pay">${isSub ? "支付并订阅套餐" : "支付并开通通道"}</button>
        <div class="rules">
          · 下单可用余额或支付宝/微信<br />
          · 调用阶段只扣平台余额，扣完提示充值<br />
          · 失败请求不计费 · 交付物为 API Key（非账号）
          ${isSub ? "<br />· 订阅退货按卖家服务标签（如七天无理由 / 用完才退）" : ""}
        </div>
        <div class="done" id="done"></div>
      </div>
    `;

    document.querySelectorAll(".pay-way").forEach((el) => {
      el.addEventListener("click", () => {
        document.querySelectorAll(".pay-way").forEach((x) => x.classList.remove("on"));
        el.classList.add("on");
        el.querySelector("input").checked = true;
      });
    });

    document.getElementById("btn-pay").addEventListener("click", () => {
      const way = document.querySelector("input[name=pay]:checked")?.value || "balance";
      const wayLabel = { balance: "平台余额", alipay: "支付宝", wechat: "微信" }[way];
      const key = "tm_" + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6);
      const done = document.getElementById("done");
      done.classList.add("is-on");
      done.innerHTML = isSub
        ? `已用「${wayLabel}」支付套餐价 ¥${payAmount}。<br />已签发 Key，订阅 ${s.days || 30} 天，期内额度 ¥${s.quota || s.face}。<code>${key}</code>把 SDK Base URL 换成平台 Edge 即可调用。到期或用尽后自动停用。`
        : `已用「${wayLabel}」${payAmount === 0 ? "完成 0 元开通" : "支付起步金 ¥" + payAmount}。<br />已签发 Key，路由指向本通道。<code>${key}</code>调用只扣平台余额；余额不足时请先充值。`;
    });
  </script>
</body>
</html>
