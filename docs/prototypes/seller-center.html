<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>闲猫 · 卖家中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="_center-shell.css" />
</head>
<body>
  <header class="header">
    <div class="header-row">
      <a class="logo" href="market-home.html">
        <img src="assets/xianmao-pet.svg" alt="" width="36" height="36" />
        闲猫
      </a>
      <span class="role-tag">卖家中心</span>
      <div class="spacer"></div>
      <a class="nav-link" href="buyer-center.html">买家中心</a>
      <a class="nav-link" href="market-home.html">回市场</a>
    </div>
  </header>

  <main class="wrap">
    <span class="route">/seller → /seller/upstreams</span>
    <h1>卖家中心</h1>
    <p class="lead">从顶栏「我要卖闲置 TOKEN」进入。对应正式应用卖家路由，先挂上游额度，再挂牌出售。</p>

    <div class="grid">
      <div class="card"><strong>上游额度</strong><span>/seller/upstreams</span></div>
      <div class="card"><strong>挂牌管理</strong><span>/seller/listings</span></div>
      <div class="card"><strong>用量</strong><span>/seller/usage</span></div>
      <div class="card"><strong>收益</strong><span>/seller/earnings</span></div>
    </div>

    <p class="note">原型占位页。正式实现见 <code>web/src/views/seller/*</code>，需登录（meta.auth）。</p>
  </main>
</body>
</html>
