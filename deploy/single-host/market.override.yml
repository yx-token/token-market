# token-market 在本机的部署覆盖：api / worker / edge 加入共享网络 token-market（由 sub2api 的 compose 创建），
# 经 sub2api:8080 访问 sub2api、经 sub2api-postgres 只读访问 sub2api 库。
services:
  api:
    networks: [default, shared]
  worker:
    networks: [default, shared]
  edge:
    networks: [default, shared]

networks:
  shared:
    name: token-market
    external: true
