# token-market 部署示例。sub2api 单独部署（不在本文件中），本系统通过内网访问它的 Admin API、网关与只读库。
#
# 使用：
#   cp deploy/.env.example deploy/.env   # 填写密钥与 sub2api 连接信息
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
#
# 对外只需暴露 api（控制面与前端）和 edge（买家调用模型）；worker 与各管理端口只在内网。
name: token-market

x-market-env: &market-env
  TM_ENV: prod
  TM_DATABASE_DSN: postgres://market:${MARKET_DB_PASSWORD}@postgres:5432/token_market?sslmode=disable
  TM_REDIS_ADDR: redis:6379
  TM_SUB2API_BASE_URL: ${SUB2API_BASE_URL}
  TM_SUB2API_GATEWAY_URL: ${SUB2API_GATEWAY_URL:-}
  TM_SUB2API_ADMIN_API_KEY: ${SUB2API_ADMIN_API_KEY}
  TM_SUB2API_REPLICA_DSN: ${SUB2API_REPLICA_DSN}
  TM_CRYPTO_ACTIVE_KEY_ID: ${CRYPTO_ACTIVE_KEY_ID:-k1}
  TM_CRYPTO_KEYS: ${CRYPTO_KEYS}
  TM_CRYPTO_HASH_PEPPER: ${CRYPTO_HASH_PEPPER}
  TM_AUTH_JWT_SECRET: ${JWT_SECRET}
  TM_BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  TM_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
  TM_EDGE_PUBLIC_URL: ${EDGE_PUBLIC_URL}
  TM_HTTP_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  TM_EDGE_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
  # 支付（密钥文件放在 deploy/secrets/，容器内路径 /app/secrets/...）
  TM_PAYMENT_PUBLIC_URL: ${PAYMENT_PUBLIC_URL:-}
  TM_ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
  TM_ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-}
  TM_ALIPAY_PRIVATE_KEY_FILE: ${ALIPAY_PRIVATE_KEY_FILE:-}
  TM_ALIPAY_PUBLIC_KEY_FILE: ${ALIPAY_PUBLIC_KEY_FILE:-}
  TM_ALIPAY_APP_CERT_FILE: ${ALIPAY_APP_CERT_FILE:-}
  TM_ALIPAY_CERT_FILE: ${ALIPAY_CERT_FILE:-}
  TM_ALIPAY_ROOT_CERT_FILE: ${ALIPAY_ROOT_CERT_FILE:-}
  TM_WECHAT_APP_ID: ${WECHAT_APP_ID:-}
  TM_WECHAT_MCH_ID: ${WECHAT_MCH_ID:-}
  TM_WECHAT_MCH_SERIAL_NO: ${WECHAT_MCH_SERIAL_NO:-}
  TM_WECHAT_PRIVATE_KEY_FILE: ${WECHAT_PRIVATE_KEY_FILE:-}
  TM_WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY:-}
  TM_WECHAT_PUBLIC_KEY_ID: ${WECHAT_PUBLIC_KEY_ID:-}
  TM_WECHAT_PUBLIC_KEY_FILE: ${WECHAT_PUBLIC_KEY_FILE:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: market
      POSTGRES_PASSWORD: ${MARKET_DB_PASSWORD}
      POSTGRES_DB: token_market
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U market -d token_market"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: Dockerfile }
    image: token-market:latest
    entrypoint: ["/app/bin/api"]
    environment:
      <<: *market-env
      TM_HTTP_ADDR: ":8080"
    ports: ["${API_PORT:-8080}:8080"]
    volumes: ["./secrets:/app/secrets:ro"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    image: token-market:latest
    entrypoint: ["/app/bin/worker"]
    environment:
      <<: *market-env
      TM_WORKER_ADMIN_ADDR: ":8092"
    volumes: ["./secrets:/app/secrets:ro"]
    depends_on: [api]
    restart: unless-stopped

  edge:
    image: token-market:latest
    entrypoint: ["/app/bin/edge"]
    environment:
      <<: *market-env
      TM_EDGE_ADDR: ":8090"
    ports: ["${EDGE_PORT:-8090}:8090"]
    volumes: [edgespool:/app/data]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  edgespool:
