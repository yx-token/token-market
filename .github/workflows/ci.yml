# 持续集成：推送到 main、提交 PR 时运行；发布流程（release.yml）也复用它作为发布前的检查。
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go 检查与测试
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tm
          POSTGRES_PASSWORD: tm
          POSTGRES_DB: tm
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U tm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
    env:
      TM_TEST_DATABASE_DSN: postgres://tm:tm@127.0.0.1:55432/tm?sslmode=disable
      TM_TEST_REDIS_ADDR: 127.0.0.1:56379
      TM_SUB2API_REPO: ${{ github.workspace }}/../sub2api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # 兼容检查与端到端测试读取 sub2api 仓库中指定版本的迁移脚本（只取两个标签，不检出文件）
      - name: 获取 sub2api 迁移（v0.2.10、v0.2.14）
        run: |
          git init -q "$TM_SUB2API_REPO"
          git -C "$TM_SUB2API_REPO" fetch -q --depth=1 https://github.com/Wei-Shaw/sub2api.git \
            refs/tags/v0.2.10:refs/tags/v0.2.10 refs/tags/v0.2.14:refs/tags/v0.2.14

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "需要 gofmt：" && echo "$unformatted" && exit 1; fi

      - name: go vet
        run: go vet ./...

      # 用本仓库的 Go 版本编译 golangci-lint，避免预编译版本低于 go.mod 要求的 Go 版本
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0
          golangci-lint run ./...
          golangci-lint run --build-tags integration,smoke ./...

      # 单元测试与集成测试（本系统迁移、契约查询、基于 sub2api 替身的端到端流程）
      - name: 测试
        run: go test -race -tags integration ./...

  web:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: 类型检查与构建
        run: pnpm run build

  # 镜像能否构建（不推送）；打标签发布时由 release.yml 构建并推送多架构镜像，这里跳过
  image:
    name: 镜像构建
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
