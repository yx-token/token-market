# 市场层 CI：对齐本仓结构（market/ + market/web + 根目录 backend 迁移）
name: Market CI

on:
  push:
    branches: [main, feat/idlicat-as-root]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go 检查与测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tm
          POSTGRES_PASSWORD: tm
          POSTGRES_DB: tm
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U tm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["56379:6379"]
    env:
      TM_TEST_DATABASE_DSN: postgres://tm:tm@127.0.0.1:55432/tm?sslmode=disable
      TM_TEST_REDIS_ADDR: 127.0.0.1:56379
      # 宿主树在仓库根（含 backend/migrations）；兼容测试另取历史 tag
      TM_SUB2API_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: market/go.mod
          cache-dependency-path: market/go.sum

      # 兼容 / e2e 需历史引擎迁移标签（只取 tag，不切换工作区）
      - name: 获取引擎迁移标签（v0.2.10、v0.2.14）
        working-directory: ${{ github.workspace }}
        run: |
          git fetch -q --depth=1 https://github.com/Wei-Shaw/sub2api.git \
            refs/tags/v0.2.10:refs/tags/v0.2.10 \
            refs/tags/v0.2.14:refs/tags/v0.2.14

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "需要 gofmt：" && echo "$unformatted" && exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.0
          golangci-lint run ./...
          golangci-lint run --build-tags integration,smoke ./...

      - name: 测试
        run: go test -race -tags integration -timeout 20m ./...

  web:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market/web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: 类型检查与构建
        run: pnpm run build

  image:
    name: 镜像构建
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: market
          file: market/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
