# 发布：推送 v 开头的标签（例如 v0.3.0、v0.3.0-rc.1）时，先跑完整 CI，再构建并推送多架构镜像，最后创建 GitHub Release。
#
# 镜像推送到 ghcr.io/<仓库>，标签：v0.3.0、0.3.0、0.3，正式版另加 latest（带 - 的预发布版本只打完整版本号）。
# 国内服务器拉 GHCR 慢时，可以同时推送到一个镜像仓库副本（例如阿里云容器镜像服务）：
#   仓库变量 MIRROR_IMAGE   = registry.cn-hangzhou.aliyuncs.com/<命名空间>/token-market
#   仓库密钥 MIRROR_USERNAME、MIRROR_PASSWORD = 该镜像仓库的登录凭证
# 不设置 MIRROR_IMAGE 时只推送 GHCR。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  image:
    name: 构建并推送镜像
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MIRROR_IMAGE: ${{ vars.MIRROR_IMAGE }}
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析镜像仓库副本地址
        id: mirror
        if: env.MIRROR_IMAGE != ''
        run: echo "registry=${MIRROR_IMAGE%%/*}" >> "$GITHUB_OUTPUT"

      - name: 登录镜像仓库副本
        if: env.MIRROR_IMAGE != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.mirror.outputs.registry }}
          username: ${{ secrets.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_PASSWORD }}

      - name: 镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ env.MIRROR_IMAGE }}
          flavor: latest=auto
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=token-market
            org.opencontainers.image.description=闲置算力交易所：api（含前端）、worker、edge、s2a-compat

      - name: 构建并推送（linux/amd64、linux/arm64）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: 创建 Release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: 打包部署文件
        run: |
          dir="token-market-deploy-${GITHUB_REF_NAME}"
          mkdir "$dir"
          cp deploy/docker-compose.yml "$dir/"
          # 示例配置里的镜像改为本次发布的版本
          sed "s#^TM_IMAGE=.*#TM_IMAGE=ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}#" deploy/.env.example > "$dir/.env.example"
          tar czf "$dir.tar.gz" "$dir"

      - name: 发布
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ needs.image.outputs.tags }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          {
            echo "## 镜像"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "多架构（linux/amd64、linux/arm64），digest \`${DIGEST}\`。"
            echo
            echo "## 升级"
            echo
            echo '```bash'
            echo "# deploy/.env 中设置 TM_IMAGE=${image}"
            echo "docker compose -f deploy/docker-compose.yml --env-file deploy/.env pull"
            echo "docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d"
            echo '```'
            echo
            echo "首次部署可以直接下载附件中的 docker-compose.yml 与 .env.example。"
            echo
          } > notes.md
          asset="token-market-deploy-${GITHUB_REF_NAME}.tar.gz"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # 重新运行时只更新附件，保留已有的说明
            gh release upload "$GITHUB_REF_NAME" "$asset" --clobber
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "$asset" --verify-tag --title "$GITHUB_REF_NAME" \
              --notes-file notes.md --generate-notes "${prerelease[@]}"
          fi
