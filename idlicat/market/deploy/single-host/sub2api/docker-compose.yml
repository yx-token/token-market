# sub2api 0.2.14（token-market 的底层网关）。改编自 sub2api 官方 deploy/docker-compose.yml：
#   - 镜像固定版本：升级必须先过 token-market 的 s2a-compat 兼容检查（market-src/scripts/upgrade-sub2api.sh）
#   - 对外入口是 sub2api-admin（nginx，公网端口 ${SUB2API_PUBLIC_PORT:-8081}）：禁用在线升级 / 回滚接口，
#     sub2api 本身不映射端口；token-market 经共享网络 token-market 直连 sub2api:8080
#   - 服务改名 sub2api-postgres / sub2api-redis，避免在共享网络上与 token-market 自己的 postgres / redis 重名
name: sub2api

services:
  sub2api:
    image: weishaw/sub2api:0.2.14
    container_name: sub2api
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    ulimits:
      nofile: { soft: 100000, hard: 100000 }
    volumes:
      - sub2api_data:/app/data
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: sub2api-postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: sub2api
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: sub2api
      DATABASE_SSLMODE: disable
      REDIS_HOST: sub2api-redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      TZ: Asia/Shanghai
      # 只信任前置 nginx 传来的客户端地址（登录限流、审计按真实 IP）
      SERVER_TRUSTED_PROXIES: 172.31.250.0/24
      # token-market 基线配置（token-market docs/02 第 6 节）
      GATEWAY_SCHEDULING_PREFER_SOONEST_RESET: "true"
      GATEWAY_USAGE_RECORD_OVERFLOW_POLICY: sync
    depends_on:
      sub2api-postgres: { condition: service_healthy }
      sub2api-redis: { condition: service_healthy }
    networks: [internal, shared]
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  sub2api-postgres:
    image: postgres:18-alpine
    container_name: sub2api-postgres
    restart: unless-stopped
    command: postgres -c max_connections=200
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: sub2api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: sub2api
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [internal, shared]   # token-market 用只读账号 tm_readonly 访问
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sub2api -d sub2api && psql -U sub2api -d sub2api -Atqc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

  sub2api-redis:
    image: redis:8-alpine
    container_name: sub2api-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - redis_data:/data
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 对外入口：管理后台与网关 http://<服务器>:8081
  sub2api-admin:
    image: nginx:1.29-alpine
    container_name: sub2api-admin
    restart: unless-stopped
    ports: ["${SUB2API_PUBLIC_PORT:-8081}:80"]
    volumes:
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [sub2api]
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.31.250.0/24   # 固定网段，SERVER_TRUSTED_PROXIES 依赖它
  shared:
    name: token-market

volumes:
  sub2api_data:
  postgres_data:
  redis_data:
